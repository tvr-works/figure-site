name: Site checks

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      options: --init --ipc=host
    timeout-minutes: 12
    env:
      VITE_SITE_INDEXING: preview
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - name: Verify runtime and browser image alignment
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import assert from "node:assert/strict";
            import { execFileSync } from "node:child_process";
            const pkg = JSON.parse(readFileSync("package.json", "utf8"));
            assert.equal(process.versions.node, readFileSync(".node-version", "utf8").trim());
            assert.equal(`npm@${execFileSync("npm", ["--version"], { encoding: "utf8" }).trim()}`, pkg.packageManager);
            assert.equal(pkg.devDependencies["@playwright/test"], "1.64.1", "Update the image tag, digest and version check together.");
          '
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run check
      - name: Verify preview build and all browser flows
        run: npm run test:browser
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/preview
      - name: Verify public indexing and delivery artifact
        run: npm run test:artifact
        env:
          VITE_SITE_INDEXING: public
          CF_PAGES_BRANCH: main
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/public
      - name: Save tested public artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: site-${{ github.sha }}-${{ github.run_attempt }}
          path: dist/client/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Save browser failure evidence
        if: failure() && !cancelled()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: browser-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
